<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>李伯伯糖葫蘆</title>
    <script>
      (function () {
        var repoBase = '/leebobo-frontend/';
        var locationPath = window.location.pathname;

        if (!locationPath.startsWith(repoBase)) {
          window.location.replace(repoBase);
          return;
        }

        var route = locationPath.slice(repoBase.length);
        var redirectTarget = repoBase + '?p=/' + route
          + window.location.search.replace(/^\?/, '&')
          + window.location.hash;

        window.location.replace(redirectTarget);
      })();
    </script>
  </head>
  <body></body>
</html>
