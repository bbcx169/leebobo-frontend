    <title>李伯伯糖葫蘆</title>
    <script>
      (function () {
        var route = window.location.pathname.replace(/^\//, '');
        var redirectTarget = '/?p=/' + route
          + window.location.search.replace(/^\?/, '&')
          + window.location.hash;

        window.location.replace(redirectTarget);
      })();
    </script>
